version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file: ./backend/.env
    depends_on:
      - db

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    env_file: ./ai-service/.env

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: quies
      POSTGRES_PASSWORD: quies
      POSTGRES_DB: quies
    ports:
      - "5432:5432"
