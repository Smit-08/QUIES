version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres is actually accepting connections

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    env_file: ./ai-service/.env

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: quies
      POSTGRES_PASSWORD: quies
      POSTGRES_DB: quies
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quies -d quies"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persist data across docker-compose down/up

volumes:
  postgres_data:
